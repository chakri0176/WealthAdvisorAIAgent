services:
  - type: web
    name: wealthadvisor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  - type: web
    name: wealthadvisor-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE
        sync: false